[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    # Surface anything new as an error so we don't accumulate cruft.
    "error",
    # Allow the one warning we cannot fix here (uvloop on Windows).
    "error::ResourceWarning",
    # Upstream deprecation in starlette/anyio 4.15+
    "ignore::DeprecationWarning:starlette.*:",
    "ignore:.*BlockingPortal.*:DeprecationWarning",
]
