[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-web-cli"
dynamic = ["version"]
description = "OpenAI-compatible CLI and API gateway for authenticated DeepSeek Web sessions"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "httpx==0.28.1",
    "playwright==1.50.0",
    "rich==14.0.0",
    "playwright-stealth==1.0.6",
    "wasmtime==28.0.0",
    "fastapi==0.128.8",
    "uvicorn==0.40.0",
    "python-multipart==0.0.20",
]

[project.scripts]
deepseek = "deepseek.__main__:run"

[tool.setuptools.dynamic]
version = { attr = "deepseek.constants.VERSION" }

[tool.setuptools.packages.find]
include = ["deepseek*"]

[tool.setuptools.package-data]
deepseek = ["assets/*.js", "assets/*.wasm", "assets/*.txt"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    # Surface anything new as an error so we don't accumulate cruft.
    "error",
    # Treat async resource leaks as test failures.
    "error::ResourceWarning",
    # Upstream deprecation in starlette/anyio 4.15+
    "ignore::DeprecationWarning:starlette.*:",
    "ignore:.*BlockingPortal.*:DeprecationWarning",
]
